# Single-image stack: web (nginx SPA + Go gateway + Bun script-service) +
# s6-overlay supervisor. Connects to an EXTERNAL agent-compose daemon
# (default: the host's 7410).
#
# Usage:
#   cp .env.example .env   # then edit .env (set SCRIPT_SERVICE_TOKEN, etc.)
#   docker compose up --build
#
# If your agent-compose runs as a Docker container instead of on the host,
# either set AGENT_COMPOSE_URL to its address, or attach it to the
# agent-web-net network and set AGENT_COMPOSE_URL=http://agent-compose:7410.
# To run agent-compose inside this stack too, use docker-compose.full.yml.

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${TOKEN_RBAC_API_PORT:-8081}:8081"
    environment:
      AGENT_COMPOSE_URL: ${AGENT_COMPOSE_URL:-http://host.docker.internal:7410}
      PROJECT_STORAGE_ROOT: /data/work/projects
      LEGACY_PROJECT_STORAGE_ROOT: ${LEGACY_PROJECT_STORAGE_ROOT:-}
      # script-service runs in the same container, loopback only.
      SCRIPT_SERVICE_URL: http://127.0.0.1:7420
      SCRIPT_SERVICE_HOST: 127.0.0.1
      SCRIPT_SERVICE_PORT: "7420"
      SCRIPT_DATA_DIR: /data/scripts
      SCRIPT_SERVICE_TOKEN: ${SCRIPT_SERVICE_TOKEN:?set SCRIPT_SERVICE_TOKEN in .env}
      AUTH_MODE: ${AUTH_MODE:-disabled}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-24h}
      TOKEN_DB_PATH: /data/api/tokens.db
    volumes:
      - api-token-data:/data/api
      - script-data:/data/scripts
      - ${PROJECT_WORK_DIR:-./data/work}:/data/work
    extra_hosts:
      # Lets the container reach a host-exposed agent-compose via host.docker.internal.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - agent-web-net

networks:
  agent-web-net:
    name: agent-web-net

volumes:
  script-data:
  api-token-data:
